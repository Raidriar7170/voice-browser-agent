[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "voice-browser-agent"
version = "0.1.0"
description = "Bounded Chinese-first Voice-to-Browser Agent with safe browser execution traces."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "browser-use>=0.1.0",
  "browser-use-vision",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.7.0",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30.0",
  "playwright>=1.45.0",
]

[project.optional-dependencies]
asr = [
  "faster-whisper>=1.0.0",
]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/voice_browser_agent"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
browser-use-vision = { path = "../../../browser-use-vision", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
