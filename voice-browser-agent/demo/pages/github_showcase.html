<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Controlled GitHub Showcase</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; color: #172026; }
      header { align-items: center; border-bottom: 1px solid #ccd4d9; display: flex; gap: 12px; padding: 16px 24px; }
      main { padding: 24px; }
      input { border: 1px solid #8fa0aa; border-radius: 6px; min-height: 38px; padding: 0 10px; width: min(420px, 100%); }
      button { border: 1px solid #172026; border-radius: 6px; background: #172026; color: white; min-height: 38px; padding: 0 14px; }
      .result { border: 1px solid #d6dde2; border-radius: 8px; margin-top: 18px; padding: 14px; }
    </style>
    <script>
      function runSearch() {
        const input = document.querySelector("[aria-label='repository search']");
        const result = document.querySelector("[data-result]");
        result.textContent = `Search results for ${input.value || "browser-use-vision"}`;
      }
    </script>
  </head>
  <body>
    <header>
      <strong>Controlled code search</strong>
      <input aria-label="repository search" value="browser-use-vision" />
      <button type="button" aria-label="run controlled search" onclick="runSearch()">Search</button>
    </header>
    <main>
      <h1>Controlled GitHub Showcase</h1>
      <p>This local page demonstrates a public-code-search-shaped command without opening a real public website.</p>
      <section class="result" aria-label="search results" data-result>Ready to search public repository examples.</section>
    </main>
  </body>
</html>
