<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Controlled SVG Dashboard</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 24px; }
      svg { border: 1px solid #ccd4d9; border-radius: 6px; }
    </style>
  </head>
  <body>
    <h1>Dashboard chart demo</h1>
    <svg width="520" height="220" role="img" aria-label="sales chart">
      <rect x="40" y="110" width="70" height="80" fill="#4e79a7"></rect>
      <rect x="150" y="70" width="70" height="120" fill="#59a14f"></rect>
      <rect x="260" y="40" width="70" height="150" fill="#e15759"></rect>
      <rect x="370" y="95" width="70" height="95" fill="#f28e2b"></rect>
      <text x="260" y="28" text-anchor="middle">Highest bar is red</text>
    </svg>
  </body>
</html>
