<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Controlled Icon Toolbar</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; }
      header { align-items: center; border-bottom: 1px solid #ccd4d9; display: flex; gap: 8px; justify-content: flex-end; padding: 16px; }
      button { border: 1px solid #6b7a84; border-radius: 6px; background: white; height: 40px; width: 40px; }
      main { padding: 24px; }
    </style>
  </head>
  <body>
    <header aria-label="toolbar">
      <button aria-label="settings">⚙</button>
      <button aria-label="search">⌕</button>
      <button aria-label="help">?</button>
    </header>
    <main>
      <h1>Icon-only toolbar demo</h1>
      <p>The correct target is the search icon in the top-right toolbar.</p>
    </main>
  </body>
</html>
